<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b10">
<title>FinanPro V2</title>
<style>
:root{--bg:#050b10;--card:#09151d;--green:#00e39a;--text:#f5fbff;--muted:#78939f;--red:#ff4e61;--blue:#48a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:430px;margin:auto;min-height:100vh;padding:18px 16px 96px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:22px;font-weight:800}.logo span{color:var(--green)}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#13252d;font-weight:800}
h1{font-size:28px;margin:4px 0}.muted,.label{color:var(--muted)}.card{background:var(--card);border:1px solid #12252e;border-radius:18px;padding:16px;margin:12px 0}
.hero{padding:20px}.amount{font-size:30px;font-weight:800;margin:5px 0 15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#0b1a22;border-radius:14px;padding:12px}.stat b{display:block;margin-top:5px;font-size:18px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row+.row{margin-top:12px}.tx{display:flex;align-items:center;gap:10px;min-width:0}
.txtext{min-width:0}.txtext b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txtext small{color:var(--muted)}
.icon{width:38px;height:38px;border-radius:12px;background:#10212a;display:grid;place-items:center;font-weight:800;flex:none}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);height:72px;background:#081219ee;border-top:1px solid #142830;display:flex;justify-content:space-around;align-items:center;z-index:4}
nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:8px}.navactive{color:var(--green)!important;font-weight:700}
.fab{position:fixed;right:max(calc((100vw - 430px)/2 + 18px),18px);bottom:84px;width:56px;height:56px;border:0;border-radius:50%;background:var(--green);color:#03120d;font-size:30px;font-weight:800;z-index:5}
button{font:inherit}.primary{border:0;border-radius:12px;padding:12px 15px;background:var(--green);color:#03120d;font-weight:800}.secondary{border:1px solid #1c343e;border-radius:12px;padding:11px 14px;background:#0b1a22;color:var(--text)}
.danger{border-color:#63303a;color:#ff9aa5}.full{width:100%}
input,select{width:100%;background:#08151c;border:1px solid #1b333d;color:var(--text);border-radius:12px;padding:12px;margin-top:6px}.formrow{margin:10px 0}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{width:min(430px,100%);max-height:88vh;overflow:auto;background:#09151d;border:1px solid #19313b;border-radius:22px 22px 0 0;padding:20px 16px 28px}
.actions{display:flex;gap:10px;margin-top:15px}.actions>*{flex:1}.hidden{display:none}.progress{height:8px;background:#14252c;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}
.empty{text-align:center;padding:25px;color:var(--muted)}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#10252a;color:var(--green)}
.listitem{padding:12px 0;border-bottom:1px solid #142830}.listitem:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">FinanPro <span>V2</span></div><div class="avatar">MW</div></header>
<main id="screen"></main>
</div>
<button class="fab" onclick="openTx()">+</button>
<nav>
<button id="n-home" onclick="show('home')">⌂<br>Inicio</button>
<button id="n-mov" onclick="show('mov')">↕<br>Movimientos</button>
<button id="n-goals" onclick="show('goals')">◎<br>Metas</button>
<button id="n-more" onclick="show('more')">☰<br>Más</button>
</nav>

<div id="modal" class="modal hidden">
<div class="sheet">
<h2 id="modalTitle" style="margin-top:0">Nuevo movimiento</h2>
<div id="modalBody"></div>
</div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://jbycxsqgyzdksxsbitfu.supabase.co';
const SUPABASE_KEY='sb_publishable_cqX_1h-ZSA76KT0iQ_SoQw_QT6IuL4_';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null, accounts=[], categories=[], tx=[], goals=[];
const $=id=>document.getElementById(id);
const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);

async function init(){
  const {data}=await supabase.auth.getSession();
  user=data.session?.user||null;
  if(!user){
    renderLogin();
    return;
  }
  await loadAll();
  show('home');
}
function renderLogin(){
  $('screen').innerHTML=`<div class="card hero">
    <span class="badge">☁️ Supabase conectado</span>
    <h1>Tu dinero, sincronizado.</h1>
    <p class="muted">FinanPro guardará cuentas, movimientos y metas en la nube de forma privada.</p>
    <button class="primary full" onclick="anonymousLogin()">Entrar a FinanPro</button>
    <p class="muted" style="font-size:12px;margin-bottom:0">Se usará una cuenta anónima del dispositivo. Más adelante podemos convertirla en una cuenta con correo.</p>
  </div>`;
}
window.anonymousLogin=async()=>{
  const {error}=await supabase.auth.signInAnonymously();
  if(error) alert('No se pudo iniciar: '+error.message);
  else { const {data}=await supabase.auth.getSession(); user=data.session.user; await loadAll(); show('home'); }
};
async function loadAll(){
  const a=await supabase.from('accounts').select('*').eq('is_active',true).order('created_at');
  if(a.error){alert(a.error.message);return} accounts=a.data||[];
  if(!accounts.length){
    const r=await supabase.from('accounts').insert({user_id:user.id,name:'Efectivo',type:'cash',currency:'PEN',current_balance:0}).select().single();
    if(!r.error) accounts=[r.data];
  }
  const c=await supabase.from('categories').select('*').order('is_system').order('name');
  categories=c.data||[];
  const t=await supabase.from('transactions').select('*,accounts:account_id(name),categories:category_id(name)').is('deleted_at',null).order('transaction_date',{ascending:false}).order('created_at',{ascending:false});
  tx=t.data||[];
  const g=await supabase.from('goals').select('*').order('created_at');
  goals=g.data||[];
  if(!goals.length){
    const r=await supabase.from('goals').insert({user_id:user.id,name:'Suzuki Jimny',target_amount:45000,saved_amount:0}).select().single();
    if(!r.error) goals=[r.data];
  }
}
function totals(){
  return tx.reduce((o,x)=>{if(x.type==='income')o.i+=Number(x.amount);if(x.type==='expense')o.e+=Number(x.amount);return o},{i:0,e:0});
}
window.show=(p)=>{
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('navactive'));
  $('n-'+p)?.classList.add('navactive');
  if(p==='home')home(); else if(p==='mov')movements(); else if(p==='goals')goalsPage(); else more();
}
function txRow(x,withDelete=false){
  const inc=x.type==='income';
  return `<div class="listitem"><div class="row"><div class="tx"><div class="icon">${inc?'↗':'↘'}</div><div class="txtext"><b>${esc(x.merchant||x.note||'Movimiento')}</b><small>${esc(x.categories?.name||'Sin categoría')} · ${esc(x.transaction_date)} · ${esc(x.accounts?.name||'Sin cuenta')}</small></div></div><strong class="${inc?'green':'red'}">${inc?'+':'-'}${money(x.amount)}</strong></div>${withDelete?`<button class="secondary danger full" style="margin-top:8px" onclick="deleteTx('${x.id}')">Eliminar</button>`:''}</div>`;
}
function home(){
  const t=totals(), recent=tx.slice(0,5);
  $('screen').innerHTML=`<div class="muted">Hola, Marcos 👋</div><h1>Tu dinero</h1>
  <div class="card hero"><div class="label">Disponible</div><div class="amount">${money(t.i-t.e)}</div>
  <div class="stats"><div class="stat"><span class="label">Ingresos</span><b class="green">${money(t.i)}</b></div><div class="stat"><span class="label">Gastos</span><b class="red">${money(t.e)}</b></div></div></div>
  <h3>Cuentas</h3><div class="card">${accounts.map(a=>`<div class="row"><div><b>${esc(a.name)}</b><div class="muted">${esc(a.type)} · ${esc(a.currency)}</div></div><b>${money(a.current_balance)}</b></div>`).join('<div style="height:12px"></div>')}</div>
  <h3>Últimos movimientos</h3><div class="card">${recent.length?recent.map(x=>txRow(x)).join(''):'<div class="empty">Presiona + para registrar tu primer movimiento.</div>'}</div>
  <div class="card"><b>Sincronización</b><p class="muted">☁️ Tus datos están guardados en Supabase y asociados a este usuario.</p></div>`;
}
function movements(){
  $('screen').innerHTML=`<h1>Movimientos</h1><div class="muted">Datos reales de Supabase.</div>
  <div class="card">${tx.length?tx.map(x=>txRow(x,true)).join(''):'<div class="empty">No hay movimientos.</div>'}</div>`;
}
function goalsPage(){
  $('screen').innerHTML=`<h1>Metas</h1><div class="muted">Ahorros sincronizados.</div>
  ${goals.map(g=>{let p=Math.min(100,Number(g.target_amount)?Number(g.saved_amount)/Number(g.target_amount)*100:0);return `<div class="card">
  <div class="row"><b>${esc(g.name)}</b><b class="green">${p.toFixed(0)}%</b></div>
  <div class="progress" style="margin:12px 0 8px"><i style="width:${p}%"></i></div>
  <div class="row"><span class="muted">${money(g.saved_amount)}</span><span class="muted">Meta ${money(g.target_amount)}</span></div>
  <button class="primary full" style="margin-top:12px" onclick="contribute('${g.id}')">Agregar ahorro</button></div>`}).join('')}`;
}
function more(){
  $('screen').innerHTML=`<h1>FinanPro</h1>
  <div class="card"><b>☁️ Cuenta</b><p class="muted">ID de usuario activo y protegido por RLS.</p><button class="secondary full" onclick="signOut()">Cerrar sesión</button></div>
  <div class="card"><b>🇵🇪 Modo Perú</b><p class="muted">Soles, efectivo, Yape, Plin, bancos y tarjetas. Podemos ampliar las cuentas en la siguiente versión.</p></div>
  <div class="card"><b>Versión 1.2.0</b><p class="muted">Supabase: cuentas, movimientos y metas conectados.</p></div>`;
}
window.openTx=()=>{
  $('modalTitle').textContent='Nuevo movimiento';
  $('modalBody').innerHTML=`<div class="formrow"><label>Tipo</label><select id="fType"><option value="expense">Gasto</option><option value="income">Ingreso</option></select></div>
  <div class="formrow"><label>Descripción</label><input id="fDesc" placeholder="Ej. Alimentación"></div>
  <div class="formrow"><label>Monto (S/)</label><input id="fAmount" type="number" min="0" step="0.01" placeholder="0.00"></div>
  <div class="formrow"><label>Cuenta</label><select id="fAccount">${accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>
  <div class="formrow"><label>Categoría</label><select id="fCat">${categories.map(c=>`<option value="${c.id}">${esc(c.icon||'')} ${esc(c.name)}</option>`).join('')}</select></div>
  <div class="formrow"><label>Fecha</label><input id="fDate" type="date" value="${today()}"></div>
  <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveTx()">Guardar</button></div>`;
  $('modal').classList.remove('hidden');
};
window.closeModal=()=>{$('modal').classList.add('hidden')};
window.saveTx=async()=>{
  const amount=Number($('fAmount').value), desc=$('fDesc').value.trim();
  if(!desc||amount<=0){alert('Completa descripción y monto.');return}
  const r=await supabase.from('transactions').insert({user_id:user.id,account_id:$('fAccount').value,category_id:$('fCat').value,type:$('fType').value,amount,currency:'PEN',transaction_date:$('fDate').value,merchant:desc}).select().single();
  if(r.error){alert(r.error.message);return}
  closeModal(); await loadAll(); show('home');
};
window.deleteTx=async id=>{
  if(!confirm('¿Eliminar este movimiento?'))return;
  const r=await supabase.from('transactions').update({deleted_at:new Date().toISOString()}).eq('id',id);
  if(r.error)alert(r.error.message); else {await loadAll();show('mov')}
};
window.contribute=async goalId=>{
  const n=Number(prompt('¿Cuánto quieres agregar a la meta?','100'));
  if(!(n>0))return;
  const r=await supabase.from('goal_contributions').insert({goal_id:goalId,user_id:user.id,amount:n,contribution_date:today()});
  if(r.error)alert(r.error.message); else {await loadAll();goalsPage()}
};
window.signOut=async()=>{await supabase.auth.signOut();location.reload()};
supabase.auth.onAuthStateChange(async(_event,session)=>{if(session&&!user){user=session.user;await loadAll();show('home')}});
init();
</script>
</body></html>
