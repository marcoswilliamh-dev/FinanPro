<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b10"><title>FinanPro V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#050b10;color:#f5fbff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:430px;margin:auto;min-height:100vh;background:#050b10;padding-bottom:86px}.top{padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:800}.brand b{color:#00e39a}.avatar{width:38px;height:38px;border-radius:50%;background:#10242c;border:1px solid #1c414c;display:grid;place-items:center;color:#00e39a;font-weight:800}.page{padding:8px 16px 20px}.muted{color:#78939f}.card{background:#09151d;border:1px solid #12313b;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 8px 30px #0005}.hero{background:linear-gradient(145deg,#0b2027,#081219);border-color:#155044}.eyebrow{font-size:12px;color:#00e39a;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.money{font-size:31px;font-weight:850;margin:5px 0}.xpbar{height:10px;background:#10232b;border-radius:10px;overflow:hidden;margin:9px 0}.xpbar i{display:block;height:100%;width:83%;background:#00e39a;border-radius:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0a1820;border:1px solid #12313b;border-radius:13px;padding:11px}.stat strong{display:block;font-size:15px}.green{color:#00e39a}.red{color:#ff4e61}.blue{color:#48a7ff}.orange{color:#ffae2e}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:18px;font-weight:800;margin:6px 0 12px}.btn{border:0;border-radius:13px;padding:12px 15px;background:#00e39a;color:#03120e;font-weight:800}.btn.secondary{background:#0b2029;color:#dff9f2;border:1px solid #155044}.btn.small{padding:8px 11px;font-size:12px}.mission{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #12313b}.mission:last-child{border:0}.check{width:25px;height:25px;border-radius:8px;border:1px solid #24525c;display:grid;place-items:center}.check.done{background:#00e39a;color:#00140e;border:0}.badge{font-size:11px;background:#102a25;color:#00e39a;padding:4px 7px;border-radius:8px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:76px;background:#071117ee;border-top:1px solid #15323a;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:5}.nav button{background:none;border:0;color:#78939f;font-size:11px}.nav button.active{color:#00e39a}.fab{width:54px;height:54px;border-radius:50%;border:4px solid #071117;background:#00e39a;color:#03120e;font-size:28px;font-weight:700;margin:-27px auto 0;box-shadow:0 5px 25px #00e39a55}.icon{font-size:20px;display:block;margin-bottom:3px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{width:min(430px,100%);margin:auto;background:#09151d;border:1px solid #16414b;border-radius:24px 24px 0 0;padding:20px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{background:#0b2029;color:#eafff8;border:1px solid #163943;border-radius:15px;padding:18px 8px}.choice button.sel{border-color:#00e39a;background:#0d2b27}.field{margin:10px 0}.field label{font-size:12px;color:#78939f;display:block;margin-bottom:5px}.field input,.field select{width:100%;background:#071117;border:1px solid #173943;color:#f5fbff;border-radius:12px;padding:12px;outline:none}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#00e39a;color:#00140e;padding:11px 16px;border-radius:12px;font-weight:800;z-index:20;display:none}.account{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #12313b}.circle{width:39px;height:39px;border-radius:12px;background:#10262f;display:grid;place-items:center;color:#00e39a}.goal{padding:14px;border-radius:15px;background:#08141b;border:1px solid #15363f;margin:10px 0}.goalbar{height:9px;background:#10242b;border-radius:10px;overflow:hidden}.goalbar i{display:block;height:100%;background:#00e39a}.empty{text-align:center;padding:30px 10px;color:#78939f}.danger{background:#35151b;border-color:#71303b}.pill{border-radius:20px;padding:6px 9px;background:#10242b;font-size:11px}.listitem{padding:13px 0;border-bottom:1px solid #12313b}.screen{display:none}.screen.active{display:block}.level{font-size:13px;color:#dff9f2}.bigemoji{font-size:32px}
</style></head><body><div class="app"><div class="top"><div class="brand">FinanPro <b>V2</b></div><div class="avatar">MW</div></div><main class="page"><section id="home" class="screen active"></section><section id="moves" class="screen"></section><section id="goals" class="screen"></section><section id="plan" class="screen"></section><section id="more" class="screen"></section></main></div><div id="modal" class="modal"><div class="sheet"><div class="row"><div class="title">Registrar movimiento</div><button class="btn secondary small" onclick="closeModal()">Cerrar</button></div><div class="choice"><button id="incomeBtn" onclick="setType('income')">🟢<br>Ingreso</button><button id="expenseBtn" class="sel" onclick="setType('expense')">🔴<br>Gasto</button></div><div class="field"><label>Monto (S/)</label><input id="amount" type="number" step="0.01" placeholder="0.00"></div><div class="field"><label>Descripción</label><input id="merchant" placeholder="Ej. Almuerzo"></div><div class="field"><label>Cuenta</label><select id="account"></select></div><div class="field"><label>Categoría</label><select id="category"></select></div><div class="field"><label>Fecha</label><input id="date" type="date"></div><button class="btn" style="width:100%;margin-top:8px" onclick="saveMove()">Guardar movimiento + XP</button></div></div><div id="toast" class="toast"></div><nav class="nav"><button onclick="go('home')" id="n-home" class="active"><span class="icon">⌂</span>Inicio</button><button onclick="go('moves')" id="n-moves"><span class="icon">↕</span>Movimientos</button><button onclick="openModal()" class="fab">+</button><button onclick="go('plan')" id="n-plan"><span class="icon">♧</span>Planificar</button><button onclick="go('more')" id="n-more"><span class="icon">•••</span>Más</button></nav>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://jbycxsqgyzdksxsbitfu.supabase.co','sb_publishable_cqX_1h-ZSA76KT0iQ_SoQw_QT6IuL4_');
let session=null,accounts=[],categories=[],transactions=[],goals=[],type='expense';
const $=id=>document.getElementById(id); const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
window.go=async function(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(''+id).classList.add('active');document.querySelectorAll('.nav button[id]').forEach(x=>x.classList.remove('active'));let n=$('n-'+id);if(n)n.classList.add('active');render(id)};
window.openModal=()=>{if(!session)return toast('Primero entra a FinanPro');populateForm();$('modal').classList.add('open')};window.closeModal=()=>$('modal').classList.remove('open');window.setType=t=>{type=t;$('incomeBtn').classList.toggle('sel',t==='income');$('expenseBtn').classList.toggle('sel',t==='expense')};
async function auth(){let r=await sb.auth.getSession();session=r.data.session;if(!session){document.body.innerHTML='<div style="max-width:430px;margin:auto;padding:70px 25px;background:#050b10;min-height:100vh;color:#f5fbff;text-align:center"><div style="font-size:58px">📈</div><h1>FinanPro <span style="color:#00e39a">V2</span></h1><p style="color:#78939f">Tu dinero, tus decisiones.</p><button id="enter" style="width:100%;padding:15px;border:0;border-radius:14px;background:#00e39a;font-weight:800">Entrar a FinanPro</button><p style="font-size:12px;color:#78939f">Usaremos una cuenta anónima de este dispositivo.</p></div>';document.getElementById('enter').onclick=async()=>{let x=await sb.auth.signInAnonymously();if(x.error)return alert(x.error.message);location.reload()};return}await load()}
async function load(){let u=session.user.id;let a=await sb.from('accounts').select('*').eq('user_id',u).eq('is_active',true).order('created_at');accounts=a.data||[];if(!accounts.length){let x=await sb.from('accounts').insert({user_id:u,name:'Efectivo',type:'cash',currency:'PEN',current_balance:0}).select().single();if(x.data)accounts=[x.data]};let c=await sb.from('categories').select('*').or(`user_id.eq.${u},is_system.eq.true`).order('name');categories=c.data||[];let t=await sb.from('transactions').select('*').eq('user_id',u).is('deleted_at',null).order('transaction_date',{ascending:false}).order('created_at',{ascending:false});transactions=t.data||[];let g=await sb.from('goals').select('*').eq('user_id',u).order('created_at');goals=g.data||[];if(!goals.length){let x=await sb.from('goals').insert({user_id:u,name:'Suzuki Jimny',target_amount:45000,saved_amount:0,icon:'🚙'}).select().single();if(x.data)goals=[x.data]};render('home')}
function sums(){let inc=transactions.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0),exp=transactions.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0);return{inc,exp,net:inc-exp}}
function render(id){if(id==='home')renderHome();if(id==='moves')renderMoves();if(id==='goals')renderGoals();if(id==='plan')renderPlan();if(id==='more')renderMore()}
function renderHome(){let s=sums(),lvl=Math.max(1,Math.floor(s.net/500)+1),xp=Math.min(95,Math.max(8,Math.round((s.net%500)/5)));let g=goals[0],gp=g?Math.min(100,Number(g.saved_amount)/Number(g.target_amount)*100):0;let recent=transactions.slice(0,3);$('home').innerHTML=`<div class="hero card"><div class="row"><div><div class="eyebrow">Tu progreso financiero</div><div class="level">⚔️ Nivel ${lvl} — Constructor financiero</div></div><div class="bigemoji">🏆</div></div><div class="money">${money(s.net)}</div><div class="muted">Patrimonio disponible estimado</div><div class="xpbar"><i style="width:${xp}%"></i></div><div class="row"><span class="muted">XP ${xp*30}/3000</span><span class="badge">+${Math.round(s.net>0?25:5)} XP hoy</span></div></div><div class="grid3"><div class="stat"><span class="muted">Ingresos</span><strong class="green">${money(s.inc)}</strong></div><div class="stat"><span class="muted">Gastos</span><strong class="red">${money(s.exp)}</strong></div><div class="stat"><span class="muted">Ahorro</span><strong class="blue">${money(s.net)}</strong></div></div><div class="card"><div class="row"><div class="title">🎯 Misión de hoy</div><span class="badge">+80 XP</span></div><div class="mission"><div class="check done">✓</div><div><b>Conoce tus gastos</b><div class="muted">Registra cada movimiento del día</div></div></div><div class="mission"><div class="check">○</div><div><b>Ahorra S/20</b><div class="muted">Haz crecer tu próxima meta</div></div></div><div class="mission"><div class="check">○</div><div><b>Evita una compra impulsiva</b><div class="muted">+40 XP de autocontrol</div></div></div></div><div class="card"><div class="row"><div class="title">🚗 Misión: Suzuki Jimny</div><span class="pill">${gp.toFixed(0)}%</span></div><div class="row"><b>${money(g?.saved_amount||0)}</b><span class="muted">de ${money(g?.target_amount||45000)}</span></div><div class="goalbar"><i style="width:${gp}%"></i></div><p class="muted">${g?`Te faltan ${money(Math.max(0,Number(g.target_amount)-Number(g.saved_amount)))}`:''}</p></div><div class="card"><div class="row"><div class="title">🔥 Tu racha</div><b class="green">7 días</b></div><p class="muted">Mantén el hábito de registrar tus gastos y desbloquea <b>Disciplina financiera</b>.</p></div><div class="card"><div class="row"><div class="title">🧠 Consejo</div><span class="badge">FinanPro</span></div><p class="muted">El objetivo no es gastar menos por gastar menos. Es conseguir que cada sol tenga un propósito.</p></div><div class="card"><div class="title">Últimos movimientos</div>${recent.length?recent.map(x=>`<div class="listitem row"><span>${x.type==='income'?'🟢':'🔴'} ${x.merchant||'Movimiento'}</span><b class="${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'-'}${money(x.amount)}</b></div>`).join(''):'<div class="empty">Todavía no tienes movimientos.<br>Pulsa + para comenzar.</div>'}</div>`}
function renderMoves(){$('moves').innerHTML=`<div class="row"><div><div class="title">Movimientos</div><div class="muted">Todo lo que haces con tu dinero</div></div><button class="btn small" onclick="openModal()">+ Registrar</button></div><div class="card">${transactions.length?transactions.map(x=>`<div class="listitem row"><div><b>${x.type==='income'?'🟢':'🔴'} ${x.merchant||'Movimiento'}</b><div class="muted">${x.transaction_date||''} · ${accounts.find(a=>a.id===x.account_id)?.name||'Cuenta'}</div></div><b class="${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'-'}${money(x.amount)}</b></div>`).join(''):'<div class="empty">Aún no hay movimientos.<br>Registra el primero y gana XP.</div>'}</div>`}
function renderGoals(){$('goals').innerHTML=`<div class="row"><div><div class="title">Metas</div><div class="muted">Convierte sueños en misiones</div></div><button class="btn small" onclick="addGoal()">+ Nueva</button></div>${goals.map(g=>{let p=Math.min(100,Number(g.saved_amount)/Number(g.target_amount)*100);return `<div class="goal"><div class="row"><div><span class="bigemoji">${g.icon||'🎯'}</span> <b>${g.name}</b></div><b class="green">${p.toFixed(0)}%</b></div><div class="row" style="margin:10px 0"><b>${money(g.saved_amount)}</b><span class="muted">/ ${money(g.target_amount)}</span></div><div class="goalbar"><i style="width:${p}%"></i></div><button class="btn secondary small" style="margin-top:12px" onclick="contribute('${g.id}')">💰 Agregar ahorro +25 XP</button></div>`}).join('')||'<div class="empty">Crea tu primera meta.</div>'}<div class="card"><b>🏆 Logros</b><div class="mission"><span>🥉</span><div><b>Primer ahorro</b><div class="muted">Ahorra tus primeros S/100</div></div></div><div class="mission"><span>🔥</span><div><b>Racha de 7 días</b><div class="muted">Hábito desbloqueado</div></div></div></div>`}
function renderPlan(){$('plan').innerHTML=`<div class="title">Planificar</div><div class="card"><div class="title">🗺️ Mapa de niveles</div><div class="mission"><span>🌱</span><div><b>Nivel 1 — Aprendiz</b><div class="muted">Conocer tus gastos ✓</div></div></div><div class="mission"><span>🪙</span><div><b>Nivel 2 — Ahorrador</b><div class="muted">Primeros S/500</div></div></div><div class="mission"><span>🛡️</span><div><b>Nivel 3 — Protegido</b><div class="muted">Fondo de emergencia</div></div></div><div class="mission"><span>⚔️</span><div><b>Nivel 5 — Guerrero contra deudas</b><div class="muted">Próximamente</div></div></div><div class="mission"><span>👑</span><div><b>Nivel 10 — Maestro financiero</b><div class="muted">Desbloqueable</div></div></div></div><div class="card"><div class="title">📊 Salud financiera</div><div class="money">${sums().net>=0?'🟢':'🔴'}</div><p class="muted">${sums().net>=0?'Vas en terreno positivo. Tu siguiente misión es convertir parte de ese saldo en ahorro real.':'Tus gastos superan tus ingresos. Tu misión: recuperar el equilibrio.'}</p></div>`}
function renderMore(){$('more').innerHTML=`<div class="title">Más</div><div class="card"><div class="account"><div class="circle">💳</div><div><b>Cuentas y tarjetas</b><div class="muted">${accounts.length} cuenta(s)</div></div></div>${accounts.map(a=>`<div class="account"><div class="circle">${a.type==='cash'?'💵':'🏦'}</div><div style="flex:1"><b>${a.name}</b><div class="muted">${a.type}</div></div><b>${money(a.current_balance)}</b></div>`).join('')}</div><div class="card"><div class="mission"><span>📚</span><div><b>Aprender finanzas</b><div class="muted">Consejos y retos educativos</div></div></div><div class="mission"><span>🤖</span><div><b>Asistente financiero</b><div class="muted">Disponible próximamente</div></div></div><div class="mission"><span>🔐</span><div><b>Seguridad</b><div class="muted">Cuenta anónima de este dispositivo</div></div></div></div>`}
function populateForm(){$('account').innerHTML=accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');let cats=categories.filter(c=>c.kind==='expense'||c.kind==='both'||type==='income');$('category').innerHTML=(cats.length?cats:categories).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');$('date').value=new Date().toISOString().slice(0,10)}
async function saveMove(){let amount=Number($('amount').value);if(!amount||amount<=0)return toast('Ingresa un monto');let x=await sb.from('transactions').insert({user_id:session.user.id,account_id:$('account').value||null,category_id:$('category').value||null,type,amount,currency:'PEN',transaction_date:$('date').value||new Date().toISOString().slice(0,10),merchant:$('merchant').value||null}).select().single();if(x.error)return toast(x.error.message.slice(0,35));closeModal();await load();toast(type==='expense'?'🔴 Gasto guardado · +5 XP':'🟢 Ingreso guardado · +10 XP');go('home')}
window.contribute=async id=>{let a=prompt('¿Cuánto quieres ahorrar?');let n=Number(a);if(!n||n<=0)return;let x=await sb.from('goal_contributions').insert({goal_id:id,user_id:session.user.id,amount:n,contribution_date:new Date().toISOString().slice(0,10)});if(x.error)return toast(x.error.message.slice(0,35));await load();toast('🏆 Ahorro guardado · +25 XP');go('goals')};window.addGoal=async()=>{let name=prompt('Nombre de la meta');if(!name)return;let target=Number(prompt('Monto objetivo (S/)'));if(!target)return;let x=await sb.from('goals').insert({user_id:session.user.id,name,target_amount:target,saved_amount:0,icon:'🎯'});if(x.error)return toast(x.error.message.slice(0,35));await load();go('goals')};
window.addEventListener('load',auth);
</script></body></html>
